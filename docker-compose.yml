services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - ${ENGINE_PATH:-../dolumar-engine}:/engine
      - ${ENGINE_PATH:-../dolumar-engine}:/app/vendor/catlabinteractive/dolumar-engine
    depends_on:
      - mysql
      - memcached
      - mailpit
      - oidc-mock

  mysql:
    image: mysql:8.0
    # Set MYSQL_CHARSET to the production snapshot charset once known.
    command: --character-set-server=${MYSQL_CHARSET:-utf8mb4}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dolumar
      MYSQL_USER: dolumar
      MYSQL_PASSWORD: dolumar
    volumes:
      - mysql-data:/var/lib/mysql

  memcached:
    image: memcached:1.6

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # Dev-only OpenID Connect provider so you can log in locally. See .ai/development.md.
  oidc-mock:
    image: php:8.4-cli
    command: php -S 0.0.0.0:8090 /srv/index.php
    environment:
      OIDC_MOCK: "1"
    volumes:
      - ./docker/oidc-mock:/srv
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  mysql-data:
