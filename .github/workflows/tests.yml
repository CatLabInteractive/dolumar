name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit and lint (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli, gd, bcmath, memcached
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check
        run: find src bootstrap cron tools public tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHP 8.4 compatibility
        run: vendor/bin/phpcs -q -n

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit
